<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malditos Hámsters — Colibrí Ilustradora</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar" aria-label="Principal">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">
      <img class="menu-logo" src="assets/logo-menu.webp" width="420" height="242" alt="">
      <span class="menu-label">MENU<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></span>
    </button>
    <ul class="navigation" id="menu">
      <li><a href="#inicio">INICIO</a></li>
      <li><a href="#board-games">EL JUEGO</a></li>
      <li><a href="#character-design">PERSONAJES</a></li>
      <li><a href="#gallery">GALERIA</a></li>
      <li><a href="#contact">CONTACTO</a></li>
    </ul>
  </nav>
</header>


<main id="inicio">
  <!-- 1. Portada: piezas individuales superpuestas, no una galería -->
  <section class="hero-composition" id="about">
    <div class="hero-stage">
      <img class="hero-backdrop" src="assets/portada.webp" width="1299" height="534" decoding="async" fetchpriority="high" alt="Ilustración de portada con los hámsters">
      <img class="hero-pipa" src="assets/pipa.webp" width="600" height="838" decoding="async" alt="Carta La Pipa">
      <img class="hero-intro" src="assets/introduccion.webp" width="1000" height="971" decoding="async" alt="Texto de introducción del juego">
      <img class="hero-title" src="assets/malditoshamsters.webp" width="1100" height="675" decoding="async" alt="Malditos Hámsters">
      <img class="hero-tito" src="assets/tito.webp" width="1300" height="1216" decoding="async" alt="Personaje Tito">
    </div>
  </section>

  <!-- 2. Tablero -->
  <section class="board-band" id="board-games">
    <img src="assets/tablero.webp" width="1664" height="936" loading="lazy" decoding="async" alt="Tablero de Malditos Hámsters">
  </section>

  <!-- 3. Contenido -->
  <section class="contents-section">
    <img src="assets/contenido-del-juego.webp" width="1200" height="1166" loading="lazy" decoding="async" alt="Contenido del juego">
  </section>

  <!-- 4. Plantillas y cartas -->
  <section class="templates-band">
    <div class="templates-stage">
      <img class="template-back" src="assets/plantilla.webp" width="1000" height="662" loading="lazy" decoding="async" alt="Plantilla de diseño del juego">
      <img class="template-front" src="assets/plantilla-juego.webp" width="1000" height="662" loading="lazy" decoding="async" alt="Plantilla de cartas del juego">
      <img class="heart heart-1" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
      <img class="heart heart-2" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
      <img class="heart heart-3" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
      <img class="heart heart-4" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
      <img class="heart heart-5" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
      <img class="heart heart-6" src="assets/vida.avif" width="152" height="180" loading="lazy" decoding="async" alt="" aria-hidden="true">
    </div>
  </section>

  <!-- 5. Ocho cartas pequeñas, cuatro columnas por dos filas -->
  <section class="character-cards" id="character-design">
    <div class="small-card-grid">
      <img src="assets/carta-juego-1.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Chonfluns">
      <img src="assets/carta-juego-2.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Subtexto">
      <img src="assets/carta-juego-3.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Nokoa">
      <img src="assets/carta-juego-4.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Cerumen">
      <img src="assets/carta-juego-5.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Chunchufla">
      <img src="assets/carta-juego-6.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Corcho">
      <img src="assets/carta-juego-7.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Turmix">
      <img src="assets/carta-juego-8.webp" width="744" height="1098" loading="lazy" decoding="async" alt="Carta Charly Moon">
    </div>

    <!-- 6. Láminas informativas: 3 + 3 + 2 -->
    <div class="large-card-grid" id="gallery">
      <img src="assets/cartas-personaje.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Chonfluns">
      <img src="assets/cartas-hamsters-1.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Subtexto">
      <img src="assets/cartas-hamsters-2.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Chunchufla">
      <img src="assets/cartas-hamsters-3.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Corcho">
      <img src="assets/cartas-hamsters-4.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Nokoa">
      <img src="assets/cartas-hamsters-5.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Cerumen">
      <img src="assets/cartas-hamsters-6.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Turmix">
      <img src="assets/cartas-hamsters-7.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Lámina informativa Charly Moon">
    </div>
  </section>

  <!-- 7. Tres imágenes finales -->
  <section class="last-images">
    <img src="assets/cartas-hamsters-8.webp" width="1500" height="1457" loading="lazy" decoding="async" alt="Diseño de la caja del juego">
    <img id="carta-real" src="assets/cartas-real.webp" width="1400" height="1539" loading="lazy" decoding="async" alt="Fotografía de las cartas físicas">
    <img src="assets/caja-carton-interior.webp" width="1400" height="1360" loading="lazy" decoding="async" alt="Diseño de la caja interior">
  </section>

  <!-- 8. Sales sheet y pie -->
  <section class="sales-sheet">
    <a href="assets/malditoshamster.pdf" target="_blank" rel="noopener">SALES SHEET</a>
  </section>
</main>

<footer id="contact">
  <img class="footer-logo" src="assets/colibri.avif" width="608" height="152" loading="lazy" decoding="async" alt="CoHBi">
  <div class="social-links" aria-label="Redes y contacto">
    <a href="https://www.instagram.com/malditoshamsters.juego/" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.5" cy="6.5" r="1"/></svg>
    </a>
    <a href="https://www.linkedin.com/in/marta-martín-jarandilla-32ba92274/" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M5 8.5h3V20H5zM6.5 4A1.75 1.75 0 1 0 6.5 7.5 1.75 1.75 0 0 0 6.5 4ZM11 8.5h2.9v1.6h.05c.4-.76 1.4-1.95 3.35-1.95 3.58 0 4.24 2.35 4.24 5.4V20h-3v-5.72c0-1.37-.03-3.13-1.91-3.13-1.92 0-2.21 1.5-2.21 3.03V20h-3z"/></svg>
    </a>
    <a href="mailto:mmj.colibri.paint@gmail.com" aria-label="Correo electrónico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="1.5"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
    </a>
  </div>
</footer>
<dialog class="lightbox" aria-label="Vista previa de la carta">
  <button class="lb-close" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="lb-nav lb-prev" type="button" aria-label="Carta anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <img class="lb-img" alt="">
  <button class="lb-nav lb-next" type="button" aria-label="Carta siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</dialog>
<a class="to-top" href="#inicio" aria-label="Volver arriba"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></a>
<script src="script.js"></script>
</body>
</html>
